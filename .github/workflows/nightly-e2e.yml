name: Nightly E2E
run-name: Nightly E2E — ${{ github.run_id }}
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  test:
    name: Run eSignet tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Cache Node.js dependencies
        id: node-cache
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            ~/.cache/yarn/v6
          key: ${{ runner.os }}-node-nightly-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-nightly-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Dependencies
        if: steps.node-cache.outputs.cache-hit != 'true'
        run: yarn

      - name: Install Playwright
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: npx playwright install --with-deps

      - name: Run Nightly E2E Tests
        run: npx playwright test --grep @nightly
        env:
          DOMAIN: 'farajaland-integration.opencrvs.dev'

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-nightly-${{ github.run_id }}-${{ github.run_attempt }}
          path: playwright-report/
          retention-days: 30

      - name: Notify Slack on Failure
        if: failure()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          channel-id: 'C0B9GLNQEF8'
          slack-message: '❌ Nightly eSignet E2E tests failed. Check the logs at https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}.'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
